services:
  - type: web
    name: clearhire-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Supabase session pooler URL (postgresql+asyncpg://...:5432/postgres), set in the
      # dashboard. See docs/SUPABASE.md.
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      # Language model, optional (deterministic fallbacks without one). Put a Google
      # AI Studio key in GEMINI_API_KEY; LLM_PROVIDER=auto then uses Gemini.
      - key: LLM_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SEED_ENABLED
        value: "false"
      # Optional Neo4j graph read model. Neo4j AuraDB Free is enough for demo scale:
      # use its neo4j+s://<id>.databases.neo4j.io URI. Leave NEO4J_URI unset to run
      # Postgres-only (graph features use the Postgres fallback). After enabling,
      # call POST /admin/graph/rebuild once.
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
