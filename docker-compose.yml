version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clearhire_postgres
    environment:
      POSTGRES_USER: clearhire
      POSTGRES_PASSWORD: clearhire123
      POSTGRES_DB: clearhire_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearhire -d clearhire_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional graph read model (derived from Postgres). Set NEO4J_URI=bolt://localhost:7687
  # in backend/.env to enable it; then POST /admin/graph/rebuild (or seed) to fill it.
  neo4j:
    image: neo4j:5
    container_name: clearhire_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-clearhire123}
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-clearhire123} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  neo4j_data:
