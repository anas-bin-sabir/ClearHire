name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clearhire
          POSTGRES_PASSWORD: clearhire123
          POSTGRES_DB: clearhire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearhire -d clearhire_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://clearhire:clearhire123@localhost:5432/clearhire_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # Tests use hash embeddings, so skip the PyTorch-based model download.
      - name: Install dependencies
        run: |
          grep -v sentence-transformers requirements.txt > /tmp/requirements-ci.txt
          sed 's#-r requirements.txt#-r /tmp/requirements-ci.txt#' requirements-dev.txt > /tmp/requirements-dev-ci.txt
          pip install -r /tmp/requirements-dev-ci.txt
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Non-blocking until the pre-existing lint debt (mostly no-explicit-any) is paid down.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
